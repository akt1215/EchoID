name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy textual sounddevice soundfile onnxruntime

      - name: Run fast unit tests
        run: |
          python -m pytest tests/test_channel_pairer.py tests/test_channel_health.py tests/test_config_store.py tests/test_atomic_write.py tests/test_device.py tests/test_identity_resolution.py tests/test_identity_thresholds_config.py
